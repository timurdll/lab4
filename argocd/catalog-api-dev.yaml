apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: catalog-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/gitops-catalog-api.git
    targetRevision: main
    path: helm/catalog-api
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: catalog-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
